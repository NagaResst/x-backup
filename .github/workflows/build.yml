# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    strategy:
      matrix:
        # and run on both Linux and Windows
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
            ./.gradle
            ./**/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
#      - name: validate gradle wrapper
#        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'microsoft'
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: Build all versions
        run: ./gradlew buildAllVersions cli:shadowJar
      - name: Stop gradle daemon
        run: ./gradlew --stop
      - name: capture build artifacts (mods)
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: Mod Downloads
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar
            !versions/*/build/libs/*-dev-all.jar
          if-no-files-found: error
          compression-level: 9
      - name: capture build artifacts (cli)
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: CLI Tools
          path: cli/build/libs
          if-no-files-found: error
          compression-level: 9

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download mod artifacts
        uses: actions/download-artifact@v4
        with:
          name: Mod Downloads
          path: release-mods

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          name: CLI Tools
          path: release-cli

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(grep '^mod.version=' gradle.properties | cut -d= -f2)" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-mods/**/*.jar
            release-cli/**/*.jar
